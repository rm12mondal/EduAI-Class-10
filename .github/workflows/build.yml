name: Build EduAI Class 10 Full APK (With Offline Llama Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Pre-installed NDK & CMake and Build Native Llama Engine
        run: |
          # Locate Android project root automatically
          APP_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          [ -z "$APP_DIR" ] && APP_DIR="."
          echo "Detected Android Project Root: $APP_DIR"

          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi

          BRIDGE_FILE=$(find "$APP_DIR/app/src/main" -name "*Llama*Bridge*.kt" -o -name "*Llama*Bridge*.java" 2>/dev/null | head -n 1)
          if [ -n "$BRIDGE_FILE" ]; then
            PKG_NAME=$(grep -E "^package " "$BRIDGE_FILE" | awk '{print $2}' | tr -d ';' | tr '.' '_')
            CLASS_NAME=$(basename "$BRIDGE_FILE" | sed 's/\.[^.]*$//')
          else
            PKG_NAME="com_aistudio_eduaiclass10_wbkxqm"
            CLASS_NAME="LlamaJniBridge"
          fi
          JNI_PREFIX="Java_${PKG_NAME}_${CLASS_NAME}"
          echo "Detected JNI Prefix: $JNI_PREFIX"

          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          mkdir -p /tmp/llama_build
          cmake -S /tmp/llama.cpp -B /tmp/llama_build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama_build --config Release -j$(nproc)

          JNILIBS_DIR="$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS_DIR"
          find /tmp/llama_build -name "*.so" -exec cp {} "$JNILIBS_DIR/" \;

          cat <<EOF > /tmp/llama_jni.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <atomic>
          #include <cstring>
          #include "llama.h"

          static llama_model* g_model = nullptr;
          static llama_context* g_ctx = nullptr;
          static std::atomic<bool> g_stop{false};

          extern "C" {
          JNIEXPORT jboolean JNICALL ${JNI_PREFIX}_nativeLoadModel(JNIEnv* env, jobject, jstring jpath, jint n_ctx, jint n_threads) {
              const char* path = env->GetStringUTFChars(jpath, nullptr);
              llama_backend_init();
              llama_model_params mparams = llama_model_default_params();
              g_model = llama_model_load_from_file(path, mparams);
              env->ReleaseStringUTFChars(jpath, path);
              if (!g_model) return JNI_FALSE;
              llama_context_params cparams = llama_context_default_params();
              cparams.n_ctx = n_ctx > 0 ? n_ctx : 2048;
              cparams.n_threads = n_threads > 0 ? n_threads : 4;
              g_ctx = llama_init_from_model(g_model, cparams);
              return g_ctx ? JNI_TRUE : JNI_FALSE;
          }

          JNIEXPORT jstring JNICALL ${JNI_PREFIX}_nativeGenerateResponse(JNIEnv* env, jobject, jstring jprompt, jfloat temp, jint max_tokens) {
              if (!g_model || !g_ctx) return env->NewStringUTF("Model not loaded");
              g_stop = false;
              const char* prompt = env->GetStringUTFChars(jprompt, nullptr);
              const llama_vocab* vocab = llama_model_get_vocab(g_model);
              std::vector<llama_token> tokens(strlen(prompt) + 32);
              int n_tokens = llama_tokenize(vocab, prompt, strlen(prompt), tokens.data(), tokens.size(), true, true);
              env->ReleaseStringUTFChars(jprompt, prompt);
              if (n_tokens < 0) return env->NewStringUTF("");
              tokens.resize(n_tokens);

              llama_memory_clear(llama_get_memory(g_ctx), true);
              llama_batch batch = llama_batch_get_one(tokens.data(), tokens.size());
              if (llama_decode(g_ctx, batch) != 0) return env->NewStringUTF("");

              auto sparams = llama_sampler_chain_default_params();
              llama_sampler* smpl = llama_sampler_chain_init(sparams);
              llama_sampler_chain_add(smpl, llama_sampler_init_temp(temp));
              llama_sampler_chain_add(smpl, llama_sampler_init_dist(1234));

              std::string result;
              int limit = max_tokens > 0 ? max_tokens : 256;
              for (int i = 0; i < limit && !g_stop; ++i) {
                  llama_token id = llama_sampler_sample(smpl, g_ctx, -1);
                  if (llama_vocab_is_eog(vocab, id)) break;
                  char buf[256];
                  int n = llama_token_to_piece(vocab, id, buf, sizeof(buf), 0, true);
                  if (n > 0) result.append(buf, n);
                  batch = llama_batch_get_one(&id, 1);
                  if (llama_decode(g_ctx, batch) != 0) break;
              }
              llama_sampler_free(smpl);
              return env->NewStringUTF(result.c_str());
          }

          JNIEXPORT void JNICALL ${JNI_PREFIX}_nativeStopGeneration(JNIEnv*, jobject) {
              g_stop = true;
          }

          JNIEXPORT void JNICALL ${JNI_PREFIX}_nativeUnloadModel(JNIEnv*, jobject) {
              if (g_ctx) { llama_free(g_ctx); g_ctx = nullptr; }
              if (g_model) { llama_model_free(g_model); g_model = nullptr; }
          }
          }
          EOF

          CLANG_BIN=$(ls $NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang++ | sort -V | tail -n 1)
          $CLANG_BIN \
            -shared -fPIC -O3 \
            -I/tmp/llama.cpp/include \
            -I/tmp/llama.cpp/ggml/include \
            /tmp/llama_jni.cpp \
            -L"$JNILIBS_DIR" \
            -lllama -lggml -llog -landroid \
            -Wl,-rpath,'$ORIGIN' \
            -o "$JNILIBS_DIR/libllama_jni.so"

      - name: Build Debug APK with Native Llama Engine
        run: |
          APP_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          [ -z "$APP_DIR" ] && APP_DIR="."
          cd "$APP_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload EduAI-Class-10-Full-APK
        uses: actions/upload-artifact@v4
        with:
          name: EduAI-Class-10-Full-APK
          path: "**/build/outputs/apk/debug/*.apk"
