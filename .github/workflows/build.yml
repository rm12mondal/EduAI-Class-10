name: Build EduAI Class 10 Full APK (With Offline Llama Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125 cmake;3.22.1'

      - name: Build Native libllama_jni.so for arm64-v8a
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          mkdir -p /tmp/jni_build && cd /tmp/jni_build

          cat << 'EOF' > llama_jni.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <cstring>
          #include "llama.h"

          struct LlamaContextWrapper {
              llama_model* model = nullptr;
              llama_context* ctx = nullptr;
          };

          extern "C" JNIEXPORT jlong JNICALL
          Java_com_example_data_gguf_LlamaNativeBridge_nativeLoadModel(
                  JNIEnv* env, jobject /* this */,
                  jstring modelPath, jint contextLength, jint threads) {
              const char* path = env->GetStringUTFChars(modelPath, nullptr);
              llama_backend_init();

              llama_model_params mparams = llama_model_default_params();
              llama_model* model = llama_model_load_from_file(path, mparams);
              env->ReleaseStringUTFChars(modelPath, path);

              if (!model) return 0;

              llama_context_params cparams = llama_context_default_params();
              cparams.n_ctx = contextLength > 0 ? contextLength : 2048;
              cparams.n_threads = threads > 0 ? threads : 4;
              cparams.n_threads_batch = cparams.n_threads;

              llama_context* ctx = llama_init_from_model(model, cparams);
              if (!ctx) {
                  llama_model_free(model);
                  return 0;
              }

              auto* wrapper = new LlamaContextWrapper{model, ctx};
              return reinterpret_cast<jlong>(wrapper);
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_data_gguf_LlamaNativeBridge_nativeGenerate(
                  JNIEnv* env, jobject /* this */,
                  jlong handle, jstring prompt, jint maxTokens, jfloat temperature) {
              if (handle == 0) return env->NewStringUTF("");
              auto* wrapper = reinterpret_cast<LlamaContextWrapper*>(handle);
              const char* promptStr = env->GetStringUTFChars(prompt, nullptr);
              std::string input(promptStr);
              env->ReleaseStringUTFChars(prompt, promptStr);

              const llama_vocab* vocab = llama_model_get_vocab(wrapper->model);
              std::vector<llama_token> tokens(input.size() + 32);
              int n_tokens = llama_tokenize(vocab, input.c_str(), input.size(), tokens.data(), tokens.size(), true, true);
              if (n_tokens < 0) {
                  tokens.resize(-n_tokens);
                  n_tokens = llama_tokenize(vocab, input.c_str(), input.size(), tokens.data(), tokens.size(), true, true);
              }
              tokens.resize(n_tokens);

              llama_memory_clear(llama_get_memory(wrapper->ctx), true);

              llama_batch batch = llama_batch_get_one(tokens.data(), tokens.size());
              if (llama_decode(wrapper->ctx, batch) != 0) {
                  return env->NewStringUTF("");
              }

              auto sparams = llama_sampler_chain_default_params();
              llama_sampler* smpl = llama_sampler_chain_init(sparams);
              llama_sampler_chain_add(smpl, llama_sampler_init_temp(temperature));
              llama_sampler_chain_add(smpl, llama_sampler_init_dist(1234));

              std::string output;
              int limit = maxTokens > 0 ? maxTokens : 256;
              for (int i = 0; i < limit; ++i) {
                  llama_token new_token = llama_sampler_sample(smpl, wrapper->ctx, -1);
                  if (llama_vocab_is_eog(vocab, new_token)) break;

                  char buf[256];
                  int n = llama_token_to_piece(vocab, new_token, buf, sizeof(buf), 0, true);
                  if (n > 0) output.append(buf, n);

                  llama_batch next_batch = llama_batch_get_one(&new_token, 1);
                  if (llama_decode(wrapper->ctx, next_batch) != 0) break;
              }

              llama_sampler_free(smpl);
              return env->NewStringUTF(output.c_str());
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_data_gguf_LlamaNativeBridge_nativeRelease(
                  JNIEnv* /* env */, jobject /* this */, jlong handle) {
              if (handle == 0) return;
              auto* wrapper = reinterpret_cast<LlamaContextWrapper*>(handle);
              if (wrapper->ctx) llama_free(wrapper->ctx);
              if (wrapper->model) llama_model_free(wrapper->model);
              delete wrapper;
              llama_backend_free();
          }
          EOF

          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(llama_jni)
          set(CMAKE_CXX_STANDARD 17)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          add_subdirectory(/tmp/llama.cpp llama_build)
          add_library(llama_jni SHARED llama_jni.cpp)
          target_link_libraries(llama_jni PRIVATE llama ggml)
          EOF

          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)
          cp build/libllama_jni.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload EduAI Class 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: EduAI-Class-10-Full-APK
          path: app/build/outputs/apk/debug/*.apk
